apply plugin: 'com.android.library'

group = 'expo.modules.daftcitadelnative'
version = '1.0.0'

def expoModulesCorePlugin = new File(
    project(':expo-modules-core').projectDir.absolutePath,
    'ExpoModulesCorePlugin.gradle'
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()
useDefaultAndroidSdkVersions()

android {
    namespace 'expo.modules.daftcitadelnative'

    defaultConfig {
        minSdkVersion 24
        versionCode 1
        versionName '1.0.0'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -Wall -Wextra -Wpedantic'
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs = [
                'src/main/java',
                '../../../native/audio/android/src/main/java',
                '../../../native/collab/android/src/main/java',
                '../../../native/plugins/android/src/main/java'
            ]
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../../native/audio/android/src/main/jni/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
}
