name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript and repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run expo:doctor
      - name: Verify committed native hosts match Expo configuration
        shell: bash
        run: |
          npm run prebuild -- --clean --no-install
          native_diff="$(git status --porcelain -- android ios)"
          if [[ -n "$native_diff" ]]; then
            echo "$native_diff"
            echo "Native hosts are out of sync; run npm run prebuild -- --clean --no-install."
            exit 1
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run docs:check
      - run: npm run audit:prod
      - run: bash -n scripts/daftcitadel.sh scripts/rvictl-capture.sh

  native-core:
    name: Native core with ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run native:core:test:sanitize

  android:
    name: Android native compilation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: ./android/gradlew -p android :app:assembleDebug --no-daemon --stacktrace

  ios:
    name: iOS native compilation
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npx --no-install pod-install ios
      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -workspace ios/DaftCitadel.xcworkspace
          -scheme DaftCitadel
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
