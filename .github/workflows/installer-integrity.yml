name: Installer integrity

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/installer-integrity.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/installer-integrity.yml'

permissions:
  contents: read

jobs:
  installer-integrity:
    name: Shell syntax and installer structure
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate installer integrity
        run: node scripts/verifyInstaller.js
